# Builds the SiteLens field app APK in the cloud — the dev boxes have no Flutter SDK
# (and slow networks), so CI is both the Dart correctness gate (`flutter analyze`)
# and the APK factory for sideloading (DECISIONS #65: Android-only, APK for the pilot).
#
# The android/ platform dir is NOT committed: `flutter create` generates it fresh and
# tool/android_setup.sh patches in the permissions (camera, GPS, internet).
#
# One-time setup: add repo secrets SUPABASE_URL + SUPABASE_ANON_KEY (the publishable
# anon key — RLS is the security boundary). Without them the APK still builds, but
# points at the Android-emulator localhost and needs a rebuild to talk to cloud.
name: mobile-apk

on:
  push:
    branches: [master]
    paths: ['apps/mobile/**', '.github/workflows/mobile-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name sitelens_mobile .
          bash tool/android_setup.sh

      - name: Dependencies + Drift codegen
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze (the Dart correctness gate)
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Strip any whitespace/newlines a terminal paste may have wrapped into the secrets.
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$URL" \
            --dart-define=SUPABASE_ANON_KEY="$KEY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitelens-field-app
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
